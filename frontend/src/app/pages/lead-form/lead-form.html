<app-navbar title="Add New Lead" subtitle="Fill in the lead details below">
  <button class="flex items-center gap-2 bg-transparent border border-white/[0.1] text-white/50 hover:text-white hover:border-white/20 px-4 py-2 rounded-lg text-[13px] font-medium transition cursor-pointer" (click)="onCancel()">
    Cancel
  </button>
</app-navbar>

<div class="p-8">
  <div class="max-w-2xl">

    <div *ngIf="error" class="bg-red-500/10 border border-red-500/20 text-red-400 text-sm px-4 py-3 rounded-lg mb-5">
      {{ error }}
    </div>

    <!-- Contact Info -->
    <div class="bg-[#13131a] border border-white/[0.07] rounded-xl p-6 mb-4">
      <p class="text-[12px] font-semibold text-white mb-4 pb-3 border-b border-white/[0.06]">Contact Information</p>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-[11px] font-medium text-white/30 uppercase tracking-widest mb-2">Full Name *</label>
          <input type="text" [(ngModel)]="lead.fullName" placeholder="John Doe"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-4 py-2.5 text-[13px] text-white placeholder-white/20 outline-none focus:border-violet-500 transition" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-white/30 uppercase tracking-widest mb-2">Email *</label>
          <input type="email" [(ngModel)]="lead.email" placeholder="john@company.com"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-4 py-2.5 text-[13px] text-white placeholder-white/20 outline-none focus:border-violet-500 transition" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-white/30 uppercase tracking-widest mb-2">Phone *</label>
          <input type="text" [(ngModel)]="lead.phone" placeholder="+234 800 000 0000"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-4 py-2.5 text-[13px] text-white placeholder-white/20 outline-none focus:border-violet-500 transition" />
        </div>
        <div>
          <label class="block text-[11px] font-medium text-white/30 uppercase tracking-widest mb-2">Company</label>
          <input type="text" [(ngModel)]="lead.company" placeholder="Company (optional)"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-4 py-2.5 text-[13px] text-white placeholder-white/20 outline-none focus:border-violet-500 transition" />
        </div>
      </div>
    </div>

    <!-- Lead Details -->
    <div class="bg-[#13131a] border border-white/[0.07] rounded-xl p-6 mb-6">
      <p class="text-[12px] font-semibold text-white mb-4 pb-3 border-b border-white/[0.06]">Lead Details</p>
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <label class="block text-[11px] font-medium text-white/30 uppercase tracking-widest mb-2">Source *</label>
          <select [(ngModel)]="lead.source"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-4 py-2.5 text-[13px] text-white outline-none focus:border-violet-500 transition">
            <option value="" class="bg-[#1a1a24]">Select source</option>
            <option *ngFor="let s of sources" [value]="s" class="bg-[#1a1a24]">{{ s }}</option>
          </select>
        </div>
        <div>
          <label class="block text-[11px] font-medium text-white/30 uppercase tracking-widest mb-2">Status</label>
          <select [(ngModel)]="lead.status"
            class="w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-4 py-2.5 text-[13px] text-white outline-none focus:border-violet-500 transition">
            <option value="New" class="bg-[#1a1a24]">New</option>
            <option value="Contacted" class="bg-[#1a1a24]">Contacted</option>
            <option value="Qualified" class="bg-[#1a1a24]">Qualified</option>
          </select>
        </div>
      </div>
      <div>
        <label class="block text-[11px] font-medium text-white/30 uppercase tracking-widest mb-2">Notes</label>
        <textarea [(ngModel)]="lead.notes" rows="3" placeholder="Initial notes about this lead..."
          class="w-full bg-white/[0.04] border border-white/[0.08] rounded-lg px-4 py-2.5 text-[13px] text-white placeholder-white/20 outline-none focus:border-violet-500 transition resize-none"></textarea>
      </div>
    </div>

    <div class="flex justify-end gap-3">
      <button class="flex items-center gap-2 bg-transparent border border-white/[0.1] text-white/50 hover:text-white hover:border-white/20 px-5 py-2.5 rounded-lg text-[13px] font-medium transition cursor-pointer" (click)="onCancel()">Cancel</button>
      <button class="flex items-center gap-2 bg-violet-600 text-white px-5 py-2.5 rounded-lg text-[13px] font-semibold hover:bg-violet-500 transition cursor-pointer disabled:opacity-50 border-none shadow-[0_0_16px_rgba(124,92,252,0.3)]"
        (click)="onSubmit()" [disabled]="loading">
        {{ loading ? 'Adding...' : 'Add Lead →' }}
      </button>
    </div>

  </div>
</div>
